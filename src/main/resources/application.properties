# 로컬에서는 8080을 사용하고, Render에서는 PORT 환경변수를 사용합니다.
server.port=${PORT:8080}
server.address=0.0.0.0
# 프록시(Render) 뒤에서 WebSocket 출처 검사가 https 스킴을 올바르게 보도록 합니다.
server.forward-headers-strategy=framework

# ---- 로컬 기본 H2 / 배포용 PostgreSQL 환경변수 override ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/herodb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# ---- 관리자 계정: 비밀번호가 비어 있으면 관리자를 생성하지 않습니다 (로컬은 dev 프로필 사용) ----
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}

# ---- 세션 쿠키 ----
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# ---- MyBatis ----
mybatis.mapper-locations=classpath:mapper/*.xml

# 계정과 캐릭터도 같은 파일 DB에 저장되며, 스키마 생성은 기존 행을 삭제하지 않습니다.
